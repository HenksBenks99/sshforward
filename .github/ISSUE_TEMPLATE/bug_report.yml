name: Bug Report
description: Report a bug in SSH Port Forwarder
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you using? (e.g., v1.0.0, or commit hash)
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10/11
        - Linux (Ubuntu, Debian, etc.)
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode Used
      options:
        - Single
        - Multi-Cam
        - Switch
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the bug
      placeholder: |
        1. Start the application
        2. Select Multi-Cam mode
        3. Enter camera IDs: 1-10
        4. Click AVVIA TUNNEL
        5. Error occurs...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: "Tunnels should start successfully..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages.
      placeholder: "Error: Connection refused..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste relevant log output from the application
      render: text
      placeholder: "[ERRORE] Impossibile avviare: ..."
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I am using the latest version
          required: true
        - label: Credentials are configured correctly (config file or env var)
          required: true